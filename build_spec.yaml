version: 0.1 
component: build
timeoutInSeconds: 600
shell: bash

env:
  variables:
    JAVA_HOME: /usr/lib64/graalvm/graalvm-java22

  exportedVariables:
    - BuildServiceDemoVersion

steps:
  - type: Command
    name: "Instalar Java y Node.js para React"
    command: |
      yum -y install graalvm-22-jdk.x86_64
      curl -fsSL https://rpm.nodesource.com/setup_18.x | bash -
      yum -y install nodejs

  - type: Command
    name: "Set PATH Variable"
    command: export PATH=$JAVA_HOME/bin:$PATH

  - type: Command
    name: "Docker Login"
    command: docker login mx-queretaro-1.ocir.io -u "axcdvq8akxbl/a01645642@tec.mx" -p "I>S+ULuK9G{Emc>Ni4be"

  - type: Command
    name: "Construir Frontend (React)"
    command: |
      cd React
      npm install
      npm run build
      
      mkdir -p ../MtdrSpring/backend/src/main/resources/static/
      rm -rf ../MtdrSpring/backend/src/main/resources/static/*
      cp -R build/* ../MtdrSpring/backend/src/main/resources/static/

  - type: Command
    name: "Construir Backend y Empacar en Docker"
    command: |
      export DOCKER_REGISTRY="mx-queretaro-1.ocir.io/axcdvq8akxbl/reacttodo/8gr7x"
      cd MtdrSpring
      source env.sh
      cd backend
      source build.sh