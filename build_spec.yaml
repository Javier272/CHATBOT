version: 0.1 
component: build
timeoutInSeconds: 600
shell: bash

env:
  variables:
    JAVA_HOME: /usr/lib64/graalvm/graalvm-java22

  exportedVariables:
    - BuildServiceDemoVersion

steps:
  - type: Command
    name: "Install GraalVM Enterprise 22.x Native Image for Java22"
    command:  yum -y install graalvm-22-jdk.x86_64;
              ls /usr/lib64/graalvm/

  - type: Command
    name: "Set PATH Variable"
    command: export PATH=$JAVA_HOME/bin:$PATH

  - type: Command
    name: "Docker Login"
    command:  docker login mx-queretaro-1.ocir.io -u "axcdvq8akxbl/a01645642@tec.mx" -p "I>S+ULuK9G{Emc>Ni4be"

  - type: Command
    name: "Build"
    command: |
      export DOCKER_REGISTRY="mx-queretaro-1.ocir.io/axcdvq8akxbl"
      cd MtdrSpring
      source env.sh
      cd backend
        source build.sh


